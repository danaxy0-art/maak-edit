name: maak_app
description: "Ma'ak - Peer support app for people living with chronic conditions"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  url_launcher: ^6.3.2
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  file_picker: ^10.3.7
  cupertino_icons: ^1.0.6

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/botanical_background.png
  fonts:
    - family: MaakSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
