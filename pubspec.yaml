name: maak_app
description: "Ma'ak - Peer support app for people living with chronic conditions"
publish_to: 'none'
version: 4.0.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter_webrtc: ^1.6.2
  video_player: 2.10.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  file_picker: ^10.3.7
  image_picker: ^1.1.2
  camera: ^0.11.0
  flutter_local_notifications: ^20.1.0
  # Sprint 4 US5: add confirmed sessions to the phone calendar. Pinned exactly:
  # pre-1.0 releases change behaviour. Needs Flutter >=3.44 / Dart >=3.12,
  # below the >=3.47 / >=3.13 the lockfile already requires.
  device_calendar_plus: 0.12.0
  # Sprint 4 US5: remembers which sessions this device added (was transitive).
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.6
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/botanical_background.png
  fonts:
    - family: MaakSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
